name: Node SDK CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm test -- --coverage
      - run: npm run build
      - name: Check ESM and CJS entrypoints
        run: |
          node --input-type=module -e "import('./dist/index.js').then(() => console.log('esm-ok'))"
          node -e "require('./dist-cjs/index.js'); console.log('cjs-ok')"
      - name: Check publish archive
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "const p=require('./pack.json')[0]; const files=p.files.map(f=>f.path); if(!files.includes('LICENSE') || files.some(f=>/\.test\./.test(f))) process.exit(1); console.log('archive-ok')"
      - name: Smoke test the packed consumer
        run: |
          archive=$(npm pack --silent --ignore-scripts)
          consumer=$(mktemp -d)
          printf '{"type":"module","dependencies":{"@li-nk.me/node-sdk":"file:%s"}}\n' "$GITHUB_WORKSPACE/$archive" > "$consumer/package.json"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund
          (cd "$consumer" && node --input-type=module -e "const m=await import('@li-nk.me/node-sdk'); if(typeof m.LinkMeClient !== 'function') throw new Error('LinkMeClient export missing'); console.log('packed-esm-ok')")
          (cd "$consumer" && node -e "const m=require('@li-nk.me/node-sdk'); if(typeof m.LinkMeClient !== 'function') throw new Error('CJS LinkMeClient export missing'); console.log('packed-cjs-ok')")
